# Minimal Supabase-compatible stack for end-to-end tests (CI and local): Postgres, GoTrue (auth) and
# PostgREST, fronted by e2e/stack/gateway.mjs on :54321 the way Supabase's API gateway is.
# Test-only secrets; never point this at real data.
name: lkhc-e2e
services:
  db:
    image: postgres:17.5
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1:54322:5432"]
    volumes: ["./init:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      retries: 30
  auth:
    image: supabase/gotrue:v2.164.0
    depends_on: { db: { condition: service_healthy } }
    ports: ["127.0.0.1:59999:9999"]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:54321
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres?search_path=auth&sslmode=disable
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-e2e-only-jwt-secret-at-least-32-characters-long}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 1s
      retries: 60
  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on: { db: { condition: service_healthy } }
    ports: ["127.0.0.1:53000:3000"]
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-e2e-only-jwt-secret-at-least-32-characters-long}
      PGRST_DB_USE_LEGACY_GUCS: "false"
