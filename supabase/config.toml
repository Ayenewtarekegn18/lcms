# Supabase settings for LKHC, kept in the repo instead of being clicked in the dashboard.
#   local     npm run local:start uses everything below; anything not listed takes the CLI default
#   staging   the Deploy workflow compares the [auth] and [storage] settings with the project and,
#             once enabled, applies them (scripts/supabase-settings.mjs). Only settings listed here are
#             written; anything not listed is left as it is on Supabase. [remotes.*] holds per-project
#             values. A new [auth]/[storage] setting also needs a line in that script's mapping.
# Change a setting here, in a pull request, not in the dashboard: the next deploy would undo it.
# docs/ENGINEERING.md → Supabase settings.
project_id = "lkhc"

[db]
major_version = 17

[db.migrations]
# Migrations are applied by dbmate from db/migrations (npm run local:start, the Deploy workflow).
enabled = false

[db.seed]
# Test data comes from scripts/local.mjs through the API, so test logins get real passwords.
enabled = false

# Local services the app doesn't use
[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[storage]
# Upload limit; the app itself allows documents up to 10 MB and photos up to 2 MB.
file_size_limit = "10MiB"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://127.0.0.1:3000"]
# Invitation only: an admin adds people (Authentication → Users → Invite). No public sign-up.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
# Keep true: in this file it switches the whole email provider, so false would also block email
# *login*. New sign-ups are already blocked by [auth] enable_signup above.
enable_signup = true

# ---- per project -------------------------------------------------------------------------------
# Project refs are public (they're in every page the app serves); keys and passwords never go here.

[remotes.staging]
project_id = "zbkcuarjhwprebpfgtvl"

[remotes.staging.auth]
site_url = "https://lcms-kappa.vercel.app"
additional_redirect_urls = ["https://lcms-kappa.vercel.app/**", "http://localhost:3000/**"]

# [remotes.production] is added when the production project is created (docs/SETUP.md §7).
