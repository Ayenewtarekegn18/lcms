# Checks every pull request, every push to main and every published release. Deploying is a
# separate workflow (deploy.yml) that starts only when this one has passed. See docs/ENGINEERING.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Types, lint, unit tests, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

  database:
    name: Migrations (up/down round trip) and RLS checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.5
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Use psql and pg_dump from the service container (client always matches the server)
        run: |
          echo "PSQL=docker exec -i ${{ job.services.postgres.id }} psql -U postgres" >> "$GITHUB_ENV"
          echo "PG_DUMP=docker exec ${{ job.services.postgres.id }} pg_dump -U postgres" >> "$GITHUB_ENV"
      - name: Supabase roles and auth/storage stand-ins
        run: $PSQL -q -v ON_ERROR_STOP=1 < db/tests/supabase_shim.sql
      - name: Every migration up, down and up again; verify_security.sql
        run: npm run db:test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Local Supabase stack, migrations and test data (the script developers use)
        # also writes the stack's URL and test keys to $GITHUB_ENV for the steps below
        run: npm run local:start
      - name: Database types match the migrations
        run: |
          npm run -s db:types
          git diff --exit-code -- lib/database.types.ts || { echo "::error::lib/database.types.ts is out of date: run npm run db:types and commit it"; exit 1; }
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
      - name: Stack logs
        if: failure()
        run: |
          for c in $(docker ps -a --format '{{.Names}}' | grep '_lkhc$'); do
            { echo "===== $c"; docker logs --tail 300 "$c" 2>&1; } >> stack.log
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
            stack.log
          retention-days: 7
