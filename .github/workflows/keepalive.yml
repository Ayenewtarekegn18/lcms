# Keeps the free Supabase project warm: every 10 minutes, one trivial call to public.keepalive()
# (migration 20261019000007; it returns now() and reads no data). If the APP_URL variable is set, it
# also calls <APP_URL>/api/keepalive, which warms the Vercel function and checks it can reach the
# database. Scheduled runs only happen on the default branch, GitHub may delay them under load, and
# it switches schedules off after 60 days without repository activity, so add an external monitor
# on <APP_URL>/api/keepalive as well (docs/SETUP.md → Keep-warm ping).
name: Keep Supabase warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Ping Supabase and the app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          status=0
          ping() { curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 --retry-delay 10 --retry-all-errors "$@" || echo 000; }
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            code=$(ping -X POST -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H 'Content-Type: application/json' -d '{}' "${SUPABASE_URL%/}/rest/v1/rpc/keepalive")
            echo "Supabase rpc/keepalive: HTTP $code"
            [ "$code" = 200 ] || status=1
          else
            echo "::warning::Set the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets to enable the database ping"
          fi
          if [ -n "$APP_URL" ]; then
            code=$(ping "${APP_URL%/}/api/keepalive")
            echo "App /api/keepalive: HTTP $code"
            [ "$code" = 200 ] || status=1
          fi
          exit $status
