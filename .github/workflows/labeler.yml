# Labels each pull request from its branch name and changed files (.github/labeler.yml), so the
# release notes can group changes. pull_request_target is safe here: the action reads only the
# labeler config from main and the list of changed files; it never checks out or runs PR code.
name: Label pull requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
