# Dependabot proposes dependency updates as pull requests; nothing merges without you, and CI tests each one.
# Kept quiet on purpose:
#   npm packages     at most one PR a week for minor and patch updates (grouped),
#                    and one for major updates, which need a closer look
#   GitHub Actions   at most one PR a month (grouped)
# Cooldown: a release must be at least 14 days old before it's proposed, so a broken or compromised
# release has time to be noticed first. Security fixes for known vulnerabilities are separate
# (Settings → Code security → Dependabot security updates) and arrive as soon as they're published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Africa/Addis_Ababa }
    cooldown: { default-days: 14 }
    open-pull-requests-limit: 2
    commit-message: { prefix: "chore(deps)" }
    # Major versions we hold back on purpose; each is upgraded in its own planned PR:
    ignore:
      # Node.js types follow the Node version the app runs on (22: package.json engines, CI, Vercel)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the new native compiler; adopt it deliberately
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10 needs the React plugins to support it first
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly, time: "06:00", timezone: Africa/Addis_Ababa }
    cooldown: { default-days: 14 }
    open-pull-requests-limit: 1
    commit-message: { prefix: "ci(deps)" }
    groups:
      github-actions:
        patterns: ["*"]
