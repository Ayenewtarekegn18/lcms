name: Bug report
description: Something in the app doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as …
        2. Open …
        3. Click …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Local, Staging, Production]
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Signed in as
      options: [admin, elder, ministry_leader, finance, member, not signed in]
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Android phone, Chrome
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or error messages
      description: Never paste passwords, keys, or members' personal data.
